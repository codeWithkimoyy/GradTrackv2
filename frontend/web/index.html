<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GradTrack - Official Graduate Tracking and Alumni Management System of Bohol Island State University - Bilar Campus.">
  <meta name="theme-color" content="#031A48">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GradTrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GradTrack - Graduate Tracking System</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin: 0; background-color: #081B33; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <div id="loading" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;">
    <div style="width: 44px; height: 44px; border: 3.5px solid rgba(255,255,255,0.18); border-top-color: #2563EB; border-radius: 50%; animation: spin 0.9s linear infinite;"></div>
    <div style="margin-top: 18px; font-size: 16px; font-weight: 600; letter-spacing: 0.5px; color: #FFFFFF;">GradTrack</div>
    <div style="margin-top: 6px; font-size: 12px; color: rgba(255,255,255,0.65);">Bohol Island State University</div>
    <div id="error-msg" style="margin-top: 20px; padding: 12px 18px; background: rgba(239, 68, 68, 0.2); border: 1px solid #EF4444; border-radius: 8px; font-size: 12px; color: #FF8A8A; max-width: 90%; display: none; word-break: break-all;"></div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </div>
  <script>
    window.addEventListener('error', function(e) {
      var errEl = document.getElementById('error-msg');
      if (errEl) {
        errEl.style.display = 'block';
        errEl.innerText = 'Error loading application: ' + (e.message || e);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
