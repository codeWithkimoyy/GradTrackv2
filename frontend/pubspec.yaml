name: gradtracker
description: Graduate Tracking and Alumni Management System
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management / navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # UI
  responsive_framework: ^1.5.1
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Storage / files
  flutter_secure_storage: ^11.1.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  file_picker: ^12.0.0
  syncfusion_flutter_pdf: ^27.1.58
  printing: ^5.13.3
  excel: ^4.0.6

  # Utilities
  flutter_dotenv: ^5.0.2
  intl: ^0.19.0
  dio: ^5.7.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  timeago: ^3.7.0
  http: ^1.6.0
  crypto: ^3.0.7
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/.env
